name: Build and Publish Nightly RustDesk Server OSS Image

on:
  schedule:
    - cron: '38 17 * * *'
  push:
  workflow_dispatch:

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Checkout RustDesk Server repository
        id: checkout
        uses: actions/checkout@v5
        with:
          repository: rustdesk/rustdesk-server
          submodules: true
          path: rustdesk-server

      # Temporary workaround for submodule issue in RustDesk Server
      # See: https://github.com/rustdesk/rustdesk-server/pull/553#issuecomment-3097872548
      - name: Fix broken submodule (temporary)
        run: |
          cd rustdesk-server
          git rm -r libs/
          git submodule add https://github.com/rustdesk/hbb_common.git libs/hbb_common

      - name: Extract full and short commit hash
        id: commit-hash
        run: |
          echo "full=${{ steps.checkout.outputs.commit }}" >> $GITHUB_OUTPUT
          echo "short=$(echo ${{ steps.checkout.outputs.commit }} | cut -c 1-7 )" >> $GITHUB_OUTPUT

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4.0.0
        with:
          cosign-release: 'v2.5.3'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.commit-hash.outputs.short }},enable={{is_default_branch}},priority=1000
            type=raw,value=latest,enable={{is_default_branch}},priority=200
            type=raw,value=${{ steps.commit-hash.outputs.long }},enable={{is_default_branch}},priority=100
            type=ref,enable={{is_not_default_branch}},event=branch
            type=ref,enable={{is_not_default_branch}},event=tag
            type=ref,enable={{is_not_default_branch}},prefix=pr-,event=pr

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sign the resulting Docker image digest except on PRs.
      # This will only write to the public Rekor transparency log when the Docker repository is public to avoid leaking data.
      # If you would like to publish transparency data even for private images, pass --force to cosign below.
      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        # This step uses the identity token to provision an ephemeral certificate against the sigstore community Fulcio instance.
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
