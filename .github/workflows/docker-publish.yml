name: Build and Publish Nightly RustDesk Server OSS Image

on:
  schedule:
    - cron: '38 17 * * *'
  push:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Fetch latest rustdesk-server commit
        id: upstream
        run: |
          COMMIT=$(git ls-remote https://github.com/rustdesk/rustdesk-server.git HEAD | cut -f1)
          echo "full=${COMMIT}" >> $GITHUB_OUTPUT
          echo "short=$(echo ${COMMIT} | cut -c 1-7)" >> $GITHUB_OUTPUT

      - name: Check if version already exists
        id: check
        run: |
          IMAGE_NAME=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          SHORT="${{ steps.upstream.outputs.short }}"

          if docker manifest inspect ${IMAGE_NAME}:${SHORT} >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Version ${SHORT} already exists in registry"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Version ${SHORT} not found, will build new image"
          fi

      - name: Checkout RustDesk Server repository
        if: steps.check.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v5
        with:
          repository: rustdesk/rustdesk-server
          submodules: true
          path: rustdesk-server

      - name: Set up QEMU
        if: steps.check.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        if: steps.check.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        if: steps.check.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.upstream.outputs.short }},enable={{is_default_branch}},priority=1000
            type=raw,value=latest,enable={{is_default_branch}},priority=200
            type=raw,value=${{ steps.upstream.outputs.full }},enable={{is_default_branch}},priority=100
            type=ref,enable={{is_not_default_branch}},event=branch
            type=ref,enable={{is_not_default_branch}},event=tag
            type=ref,enable={{is_not_default_branch}},prefix=pr-,event=pr

      - name: Build and push Docker image
        if: steps.check.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
